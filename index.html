<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>TIMER PRO — DN Training</title>
<meta name="description" content="Temporizador de intervalos DN Training — trabajo, descanso y preparación, con plantillas rápidas y modo pantalla completa">
<meta name="theme-color" content="#0c0a14">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0c0a14;
    --surface: #15111f;
    --card: #1d1830;
    --border: rgba(255,255,255,.08);
    --primary: #9c2f74;
    --primary2: #d9456a;
    --accent: #2fb8ae;
    --accent2: #d9456a;
    --accent3: #2fb87d;
    --text: #f6f2f9;
    --muted: #ad9fc4;
    --work: #d9456a;
    --rest: #2fb8ae;
    --prep: #6f7bb3;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* GRID BG */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(47,184,174,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(47,184,174,0.05) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  .app {
    position: relative;
    z-index: 1;
    max-width: 960px;
    margin: 0 auto;
    padding: 20px 16px 60px;
  }

  /* HEADER */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 28px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--border);
  }

  .dn-badge {
    width: 42px; height: 42px; border-radius: 11px; flex-shrink: 0;
    background: linear-gradient(135deg, var(--accent), var(--primary) 55%, var(--primary2));
    display: flex; align-items: center; justify-content: center;
    font-family: system-ui, sans-serif; font-weight: 800; font-size: 15px; color: #fff;
    letter-spacing: 0.5px;
    box-shadow: 0 4px 14px rgba(156,47,116,.45);
  }

  .logo {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 2rem;
    letter-spacing: 4px;
    background: linear-gradient(100deg, var(--accent), var(--primary2) 80%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: none;
  }

  .logo span { color: var(--muted); -webkit-text-fill-color: var(--muted); background: none; opacity: 1; }

  .header-sub {
    font-family: 'DM Mono', monospace;
    font-size: 0.65rem;
    color: var(--muted);
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  /* TABS */
  .tabs {
    display: flex;
    gap: 4px;
    background: var(--surface);
    border-radius: 10px;
    padding: 4px;
    margin-bottom: 24px;
    border: 1px solid var(--border);
  }

  .tab {
    flex: 1;
    padding: 9px 12px;
    border: none;
    background: transparent;
    color: var(--muted);
    font-family: 'DM Sans', sans-serif;
    font-size: 0.8rem;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
    cursor: pointer;
    border-radius: 7px;
    transition: all 0.2s;
  }

  .tab.active {
    background: var(--card);
    color: var(--accent);
    box-shadow: 0 0 12px rgba(47,184,174,0.15);
  }

  /* PANEL */
  .panel { display: none; }
  .panel.active { display: block; }

  /* ========== TIMER DISPLAY ========== */
  .timer-main {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 28px 24px 20px;
    margin-bottom: 20px;
    position: relative;
    overflow: hidden;
  }

  .timer-main::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    transform-origin: left;
    transform: scaleX(var(--progress, 1));
    transition: transform 0.1s linear, background 0.3s;
  }

  .timer-phase-label {
    font-family: 'DM Mono', monospace;
    font-size: 0.7rem;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--muted);
    text-align: center;
    margin-bottom: 6px;
  }

  .phase-name {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.6rem;
    letter-spacing: 3px;
    text-align: center;
    margin-bottom: 12px;
    transition: color 0.3s;
  }

  .timer-clock {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(5rem, 18vw, 9rem);
    letter-spacing: 4px;
    text-align: center;
    line-height: 1;
    transition: color 0.3s;
    text-shadow: 0 0 40px currentColor;
  }

  .timer-clock.warning { color: var(--accent2) !important; animation: pulse-warn 0.5s infinite; }

  @keyframes pulse-warn {
    0%,100% { opacity: 1; }
    50% { opacity: 0.6; }
  }

  .progress-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 14px;
  }

  .step-indicator {
    font-family: 'DM Mono', monospace;
    font-size: 0.75rem;
    color: var(--muted);
    white-space: nowrap;
  }

  .progress-bar {
    flex: 1;
    height: 6px;
    background: var(--border);
    border-radius: 3px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    border-radius: 3px;
    background: var(--accent);
    transition: width 0.1s linear, background 0.3s;
  }

  /* CONTROLS */
  .controls {
    display: flex;
    gap: 10px;
    justify-content: center;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }

  .btn {
    padding: 12px 24px;
    border: none;
    border-radius: 10px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.85rem;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.2s;
  }

  .btn-primary {
    background: linear-gradient(135deg, var(--accent), var(--primary) 55%, var(--primary2));
    color: #fff;
    box-shadow: 0 0 20px rgba(156,47,116,0.35);
  }

  .btn-primary:hover { box-shadow: 0 0 30px rgba(47,184,174,0.5); transform: translateY(-1px); }

  .btn-danger {
    background: var(--accent2);
    color: #fff;
    box-shadow: 0 0 20px rgba(217,69,106,0.3);
  }

  .btn-ghost {
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--border);
  }

  .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }

  .btn:disabled { opacity: 0.3; cursor: not-allowed; transform: none !important; box-shadow: none !important; }

  /* QUEUE MINI */
  .queue-preview {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 20px;
  }

  .queue-preview-title {
    font-family: 'DM Mono', monospace;
    font-size: 0.65rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 12px;
  }

  .queue-steps {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }

  .queue-chip {
    padding: 5px 10px;
    border-radius: 6px;
    font-family: 'DM Mono', monospace;
    font-size: 0.72rem;
    border: 1px solid transparent;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .queue-chip .chip-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
  }

  .queue-chip.active-chip {
    border-color: currentColor;
    box-shadow: 0 0 8px currentColor;
    font-weight: 600;
  }

  .queue-chip.done-chip { opacity: 0.3; text-decoration: line-through; }

  /* ========== EDITOR ========== */
  .template-row {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 18px;
  }
  .template-title {
    font-family: 'DM Mono', monospace;
    font-size: 0.72rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 1.5px;
    margin-bottom: 10px;
  }
  .template-btns { display: flex; flex-wrap: wrap; gap: 8px; }
  .template-btn {
    flex: 1; min-width: 92px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 9px 6px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 0.74rem;
    font-weight: 600;
    text-align: center;
    line-height: 1.5;
    cursor: pointer;
    transition: all 0.2s;
  }
  .template-btn small { color: var(--muted); font-weight: 400; font-size: 0.68rem; }
  .template-btn:hover { border-color: var(--accent); transform: translateY(-1px); }

  .editor-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }

  .editor-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.3rem;
    letter-spacing: 2px;
    color: var(--text);
  }

  .btn-sm {
    padding: 8px 16px;
    font-size: 0.75rem;
  }

  /* Step list */
  .step-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }

  .step-row {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 14px;
    display: flex;
    align-items: center;
    gap: 10px;
    transition: border-color 0.2s;
    cursor: grab;
    user-select: none;
  }

  .step-row:hover { border-color: var(--accent); }
  .step-row.dragging { opacity: 0.4; cursor: grabbing; }
  .step-row.drag-over { border-color: var(--accent3); border-style: dashed; }

  .step-num {
    font-family: 'DM Mono', monospace;
    font-size: 0.7rem;
    color: var(--muted);
    min-width: 22px;
  }

  .step-type-pill {
    width: 10px; height: 10px;
    border-radius: 3px;
    flex-shrink: 0;
  }

  .step-name-input, .step-dur-input {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 7px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    padding: 6px 10px;
    font-size: 0.82rem;
    transition: border-color 0.2s;
    outline: none;
  }

  .step-name-input { flex: 1; min-width: 80px; }
  .step-dur-input { width: 62px; text-align: center; font-family: 'DM Mono', monospace; }

  .step-name-input:focus, .step-dur-input:focus { border-color: var(--accent); }

  .step-type-select {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 7px;
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 0.72rem;
    padding: 6px 8px;
    outline: none;
    cursor: pointer;
    width: 78px;
  }

  .dur-unit {
    font-family: 'DM Mono', monospace;
    font-size: 0.65rem;
    color: var(--muted);
    white-space: nowrap;
  }

  .icon-btn {
    background: transparent;
    border: none;
    color: var(--muted);
    cursor: pointer;
    padding: 4px 6px;
    border-radius: 6px;
    font-size: 1rem;
    transition: all 0.2s;
    line-height: 1;
  }

  .icon-btn:hover { color: var(--accent2); background: rgba(217,69,106,0.1); }
  .icon-btn.dup:hover { color: var(--accent); background: rgba(47,184,174,0.1); }
  .drag-handle { cursor: grab; color: var(--muted); font-size: 0.9rem; }

  /* Add step buttons */
  .add-step-row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 20px;
  }

  .add-type-btn {
    padding: 8px 16px;
    border: 1px dashed var(--border);
    border-radius: 8px;
    background: transparent;
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    font-size: 0.72rem;
    letter-spacing: 1px;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .add-type-btn span.dot {
    width: 8px; height: 8px;
    border-radius: 3px;
  }

  .add-type-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* Repeat */
  .repeat-row {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 16px;
    margin-bottom: 20px;
  }

  .repeat-label {
    font-family: 'DM Mono', monospace;
    font-size: 0.72rem;
    color: var(--muted);
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  .repeat-input {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 7px;
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 0.9rem;
    padding: 5px 10px;
    width: 60px;
    text-align: center;
    outline: none;
  }

  .repeat-info {
    font-family: 'DM Mono', monospace;
    font-size: 0.7rem;
    color: var(--muted);
  }

  /* ========== SAVED STRUCTURES ========== */
  .save-row {
    display: flex;
    gap: 8px;
    align-items: center;
    margin-bottom: 20px;
  }

  .save-name-input {
    flex: 1;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    padding: 10px 14px;
    font-size: 0.85rem;
    outline: none;
    transition: border-color 0.2s;
  }

  .save-name-input:focus { border-color: var(--accent3); }

  .btn-save {
    background: var(--accent3);
    color: var(--bg);
    font-weight: 700;
  }

  .saved-list { display: flex; flex-direction: column; gap: 8px; }

  .saved-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    transition: border-color 0.2s;
  }

  .saved-card:hover { border-color: var(--muted); }

  .saved-info { flex: 1; }

  .saved-name {
    font-weight: 600;
    font-size: 0.9rem;
    margin-bottom: 3px;
  }

  .saved-meta {
    font-family: 'DM Mono', monospace;
    font-size: 0.65rem;
    color: var(--muted);
  }

  .saved-chips {
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
    margin-top: 6px;
  }

  .mini-chip {
    padding: 2px 7px;
    border-radius: 4px;
    font-family: 'DM Mono', monospace;
    font-size: 0.62rem;
  }

  .saved-actions { display: flex; gap: 6px; }

  .btn-load {
    background: var(--accent);
    color: var(--bg);
    padding: 7px 14px;
    font-size: 0.72rem;
  }

  .btn-del {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 7px 10px;
    font-size: 0.72rem;
  }

  .btn-del:hover { border-color: var(--accent2); color: var(--accent2); }

  /* Empty state */
  .empty-state {
    text-align: center;
    padding: 40px 20px;
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    font-size: 0.8rem;
    letter-spacing: 1px;
  }

  /* AUDIO INDICATOR */
  .audio-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 16px;
  }

  .toggle {
    position: relative;
    width: 40px; height: 22px;
    cursor: pointer;
  }

  .toggle input { display: none; }

  .toggle-track {
    position: absolute;
    inset: 0;
    background: var(--border);
    border-radius: 11px;
    transition: background 0.2s;
  }

  .toggle input:checked + .toggle-track { background: var(--accent); }

  .toggle-thumb {
    position: absolute;
    top: 3px; left: 3px;
    width: 16px; height: 16px;
    background: white;
    border-radius: 50%;
    transition: transform 0.2s;
  }

  .toggle input:checked ~ .toggle-thumb { transform: translateX(18px); }

  .toggle-label {
    font-family: 'DM Mono', monospace;
    font-size: 0.72rem;
    color: var(--muted);
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  /* TOAST */
  .toast {
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: var(--accent3);
    color: var(--bg);
    padding: 10px 18px;
    border-radius: 8px;
    font-family: 'DM Mono', monospace;
    font-size: 0.78rem;
    font-weight: 600;
    letter-spacing: 1px;
    opacity: 0;
    transform: translateY(10px);
    transition: all 0.3s;
    z-index: 999;
    pointer-events: none;
  }

  .toast.show { opacity: 1; transform: translateY(0); }

  /* Fullscreen clock overlay */
  .fullscreen-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: var(--bg);
    z-index: 100;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 1vh;
    padding: 2vh 2vw;
  }

  .fullscreen-overlay.visible { display: flex; }

  .fs-phase {
    font-family: 'DM Mono', monospace;
    font-size: clamp(0.75rem, 1.6vw, 1.15rem);
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--muted);
  }

  .fs-name {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(2rem, 6vw, 5.5rem);
    letter-spacing: 6px;
    text-align: center;
  }

  .fs-clock {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(9rem, min(48vw, 62vh), 38rem);
    line-height: 0.9;
    letter-spacing: 6px;
    text-shadow: 0 0 80px currentColor;
    transition: color 0.3s;
  }

  .fs-step {
    font-family: 'DM Mono', monospace;
    font-size: clamp(0.7rem, 1.4vw, 1rem);
    letter-spacing: 2px;
    color: var(--muted);
  }

  @media (orientation: landscape) {
    .fs-name { font-size: clamp(1.8rem, 4.5vw, 4rem); }
    .fs-clock { font-size: clamp(10rem, min(50vw, 68vh), 42rem); }
  }

  .fs-close {
    position: absolute;
    top: 20px; right: 20px;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 8px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-family: 'DM Mono', monospace;
    font-size: 0.72rem;
    transition: all 0.2s;
  }

  .fs-close:hover { border-color: var(--text); color: var(--text); }

  .type-trabajo { color: var(--work); }
  .type-descanso { color: var(--rest); }
  .type-prep { color: var(--prep); }

  .bg-trabajo { background: rgba(217,69,106,0.15); border-color: rgba(217,69,106,0.3); }
  .bg-descanso { background: rgba(47,184,174,0.15); border-color: rgba(47,184,174,0.3); }
  .bg-prep { background: rgba(111,123,179,0.15); border-color: rgba(111,123,179,0.3); }

  @media (max-width: 600px) {
    .step-row { flex-wrap: wrap; gap: 7px; }
    .step-type-select { width: 74px; }
  }
</style>
</head>
<body>

<div class="app">
  <header>
    <div style="display:flex; align-items:center; gap:12px;">
      <div class="dn-badge">DN</div>
      <div>
        <div class="logo">TIMER<span>PRO</span></div>
        <div class="header-sub">DN Training · Entrenamiento Estructurado</div>
      </div>
    </div>
    <div style="display:flex; gap:8px;">
      <button class="btn btn-ghost btn-sm" onclick="toggleFullscreen()">⛶ Pantalla</button>
    </div>
  </header>

  <!-- TABS -->
  <div class="tabs">
    <button class="tab active" onclick="switchTab('timer')">⏱ Temporizador</button>
    <button class="tab" onclick="switchTab('editor')">✏️ Editor</button>
    <button class="tab" onclick="switchTab('saved')">💾 Guardados</button>
  </div>

  <!-- ===== TAB: TIMER ===== -->
  <div id="tab-timer" class="panel active">

    <div class="audio-row">
      <label class="toggle">
        <input type="checkbox" id="soundToggle" checked>
        <div class="toggle-track"></div>
        <div class="toggle-thumb"></div>
      </label>
      <span class="toggle-label">Sonido</span>
      <span style="font-size:1rem;margin-left:4px">🔊</span>
      <input type="range" id="volumeSlider" min="0" max="200" value="150"
        style="width:100px;accent-color:var(--accent);cursor:pointer;margin:0 6px"
        oninput="updateVolume(this.value)">
      <span class="toggle-label" id="volumeLabel">150%</span>
      <button class="btn btn-ghost btn-sm" style="padding:6px 10px;font-size:0.68rem" onclick="testBeep()">🔊 Probar</button>
      <label class="toggle" style="margin-left:10px">
        <input type="checkbox" id="voiceToggle" checked>
        <div class="toggle-track"></div>
        <div class="toggle-thumb"></div>
      </label>
      <span class="toggle-label">Voz 🗣️</span>
      <div style="flex:1"></div>
      <span class="toggle-label" id="total-time-display"></span>
    </div>

    <!-- Main clock -->
    <div class="timer-main" id="timerMain">
      <div class="timer-phase-label" id="phaseLabel">FASE</div>
      <div class="phase-name" id="phaseName">—</div>
      <div class="timer-clock" id="timerClock">00:00</div>
      <div class="progress-row">
        <div class="step-indicator" id="stepIndicator">0 / 0</div>
        <div class="progress-bar">
          <div class="progress-fill" id="progressFill" style="width:0%"></div>
        </div>
        <div class="step-indicator" id="totalRemaining">0:00</div>
      </div>
    </div>

    <!-- Controls -->
    <div class="controls">
      <button class="btn btn-primary" id="btnStartPause" onclick="startPause()">▶ Iniciar</button>
      <button class="btn btn-ghost" onclick="skipStep()">⏭ Saltar</button>
      <button class="btn btn-danger" onclick="resetTimer()">↺ Reset</button>
    </div>

    <!-- Queue preview -->
    <div class="queue-preview">
      <div class="queue-preview-title">Secuencia actual</div>
      <div class="queue-steps" id="queueSteps">
        <span style="font-family:'DM Mono',monospace;font-size:0.72rem;color:var(--muted)">Sin pasos — ve al Editor</span>
      </div>
    </div>
  </div>

  <!-- ===== TAB: EDITOR ===== -->
  <div id="tab-editor" class="panel">

    <div class="template-row">
      <div class="template-title">⚡ Plantillas rápidas</div>
      <div class="template-btns">
        <button class="template-btn" onclick="loadTemplate('tabata')">Tabata<br><small>20s/10s ×8</small></button>
        <button class="template-btn" onclick="loadTemplate('hiit')">HIIT<br><small>40s/20s ×8</small></button>
        <button class="template-btn" onclick="loadTemplate('desafio21')">Desafío 21<br><small>Circuito ×3</small></button>
        <button class="template-btn" onclick="loadTemplate('emom')">EMOM<br><small>12 min</small></button>
        <button class="template-btn" onclick="loadTemplate('fuerza')">Fuerza<br><small>3×10 series</small></button>
      </div>
    </div>

    <div class="editor-header">
      <div class="editor-title">Secuencia de pasos</div>
    </div>

    <!-- Repeat -->
    <div class="repeat-row">
      <span class="repeat-label">Repetir secuencia</span>
      <input type="number" class="repeat-input" id="repeatCount" value="1" min="1" max="99">
      <span class="repeat-label">vez(ces)</span>
      <div style="flex:1"></div>
      <span class="repeat-info" id="totalDurationInfo"></span>
    </div>

    <!-- Step list -->
    <div class="step-list" id="stepList"></div>

    <!-- Add step -->
    <div class="add-step-row">
      <button class="add-type-btn" onclick="addStep('trabajo')">
        <span class="dot" style="background:var(--work)"></span>+ Trabajo
      </button>
      <button class="add-type-btn" onclick="addStep('descanso')">
        <span class="dot" style="background:var(--rest)"></span>+ Descanso
      </button>
      <button class="add-type-btn" onclick="addStep('prep')">
        <span class="dot" style="background:var(--prep)"></span>+ Preparación
      </button>
    </div>

    <button class="btn btn-primary" style="width:100%" onclick="applyEditor()">
      ✓ Aplicar al Temporizador
    </button>

    <div style="height:10px"></div>

    <div class="save-row" style="margin-bottom:0">
      <input type="text" class="save-name-input" id="saveNameInputEditor" placeholder="Nombre para guardar…">
      <button class="btn btn-save btn-sm" onclick="saveFromEditor()">💾 Guardar</button>
    </div>
  </div>

  <!-- ===== TAB: SAVED ===== -->
  <div id="tab-saved" class="panel">

    <div class="save-row">
      <input type="text" class="save-name-input" id="saveNameInput" placeholder="Nombre de la estructura…">
      <button class="btn btn-save btn-sm" onclick="saveStructure()">💾 Guardar</button>
    </div>

    <div class="saved-list" id="savedList"></div>
  </div>
</div>

<!-- FULLSCREEN OVERLAY -->
<div class="fullscreen-overlay" id="fullscreenOverlay">
  <button class="fs-close" onclick="toggleFullscreen()">✕ Cerrar</button>
  <div class="fs-phase" id="fsPhase">FASE</div>
  <div class="fs-name" id="fsName">—</div>
  <div class="fs-clock" id="fsClock">00:00</div>
  <div class="fs-step" id="fsStep">— / —</div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
// ============================================================
// STATE
// ============================================================
let steps = []; // {name, duration, type}
let expandedSteps = []; // built from steps * repeatCount
let currentStep = 0;
let timeLeft = 0;
let totalStepTime = 0;
let running = false;
let interval = null;
let repeatCount = 1;
let fullscreenOpen = false;

const TYPE_COLORS = {
  trabajo: 'var(--work)',
  descanso: 'var(--rest)',
  prep: 'var(--prep)'
};
const TYPE_LABELS = {
  trabajo: 'TRABAJO',
  descanso: 'DESCANSO',
  prep: 'PREP'
};

// ============================================================
// PLANTILLAS RÁPIDAS
// ============================================================
const TEMPLATES = {
  tabata: {
    repeatCount: 8,
    steps: [
      { name: 'Trabajo', duration: 20, type: 'trabajo' },
      { name: 'Descanso', duration: 10, type: 'descanso' }
    ]
  },
  hiit: {
    repeatCount: 8,
    steps: [
      { name: 'Trabajo', duration: 40, type: 'trabajo' },
      { name: 'Descanso', duration: 20, type: 'descanso' }
    ]
  },
  desafio21: {
    repeatCount: 3,
    steps: [
      { name: 'Preparación', duration: 15, type: 'prep' },
      { name: 'Estación 1', duration: 40, type: 'trabajo' },
      { name: 'Transición', duration: 15, type: 'descanso' },
      { name: 'Estación 2', duration: 40, type: 'trabajo' },
      { name: 'Transición', duration: 15, type: 'descanso' },
      { name: 'Estación 3', duration: 40, type: 'trabajo' },
      { name: 'Transición', duration: 15, type: 'descanso' }
    ]
  },
  emom: {
    repeatCount: 12,
    steps: [
      { name: 'Ronda EMOM', duration: 60, type: 'trabajo' }
    ]
  },
  fuerza: {
    repeatCount: 3,
    steps: [
      { name: 'Serie', duration: 45, type: 'trabajo' },
      { name: 'Descanso', duration: 60, type: 'descanso' }
    ]
  }
};

function loadTemplate(key) {
  const t = TEMPLATES[key];
  if (!t) return;
  steps = t.steps.map(s => ({...s}));
  repeatCount = t.repeatCount;
  document.getElementById('repeatCount').value = repeatCount;
  renderEditor();
  buildExpandedSteps();
  resetTimer();
  renderQueuePreview();
  updateTotalTimeDisplay();
  showToast('⚡ Plantilla cargada y lista — puedes editarla o ir directo a Temporizador');
}

// ============================================================
// TAB SWITCHING
// ============================================================
function switchTab(tab) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.getElementById('tab-' + tab).classList.add('active');
  event.currentTarget.classList.add('active');
  if (tab === 'saved') renderSavedList();
  if (tab === 'editor') renderEditor();
}

// ============================================================
// EDITOR
// ============================================================
let dragSrcIdx = null;

function renderEditor() {
  const list = document.getElementById('stepList');
  list.innerHTML = '';

  steps.forEach((step, i) => {
    const row = document.createElement('div');
    row.className = 'step-row';
    row.draggable = true;
    row.dataset.idx = i;

    row.innerHTML = `
      <span class="drag-handle">⠿</span>
      <span class="step-num">${String(i+1).padStart(2,'0')}</span>
      <span class="step-type-pill" style="background:${TYPE_COLORS[step.type]}"></span>
      <input class="step-name-input" value="${step.name}" oninput="steps[${i}].name=this.value;updateTotalDuration()" placeholder="Nombre del paso">
      <select class="step-type-select" onchange="steps[${i}].type=this.value;renderEditor()" style="color:${TYPE_COLORS[step.type]}">
        <option value="trabajo" ${step.type==='trabajo'?'selected':''}>Trabajo</option>
        <option value="descanso" ${step.type==='descanso'?'selected':''}>Descanso</option>
        <option value="prep" ${step.type==='prep'?'selected':''}>Prep</option>
      </select>
      <input class="step-dur-input" type="number" value="${step.duration}" min="1" max="9999" oninput="steps[${i}].duration=parseInt(this.value)||1;updateTotalDuration()">
      <span class="dur-unit">seg</span>
      <button class="icon-btn dup" title="Duplicar" onclick="dupStep(${i})">⧉</button>
      <button class="icon-btn" title="Eliminar" onclick="removeStep(${i})">✕</button>
    `;

    // Drag events
    row.addEventListener('dragstart', e => { dragSrcIdx = i; row.classList.add('dragging'); });
    row.addEventListener('dragend', () => row.classList.remove('dragging'));
    row.addEventListener('dragover', e => { e.preventDefault(); row.classList.add('drag-over'); });
    row.addEventListener('dragleave', () => row.classList.remove('drag-over'));
    row.addEventListener('drop', e => {
      e.preventDefault();
      row.classList.remove('drag-over');
      if (dragSrcIdx !== null && dragSrcIdx !== i) {
        const moved = steps.splice(dragSrcIdx, 1)[0];
        steps.splice(i, 0, moved);
        renderEditor();
      }
    });

    list.appendChild(row);
  });

  document.getElementById('repeatCount').value = repeatCount;
  document.getElementById('repeatCount').oninput = function() {
    repeatCount = parseInt(this.value) || 1;
    updateTotalDuration();
  };

  updateTotalDuration();
}

function addStep(type) {
  const defaults = { trabajo: {name:'Trabajo', dur:60}, descanso: {name:'Descanso', dur:30}, prep: {name:'Preparación', dur:10} };
  steps.push({ name: defaults[type].name, duration: defaults[type].dur, type });
  renderEditor();
}

function removeStep(i) {
  steps.splice(i, 1);
  renderEditor();
}

function dupStep(i) {
  steps.splice(i+1, 0, {...steps[i]});
  renderEditor();
}

function updateTotalDuration() {
  const total = steps.reduce((s,x) => s + x.duration, 0) * repeatCount;
  document.getElementById('totalDurationInfo').textContent = steps.length ? `Total: ${fmtTime(total)} (${steps.length} pasos × ${repeatCount})` : '';
}

function applyEditor() {
  if (steps.length === 0) { showToast('Agrega al menos un paso'); return; }
  buildExpandedSteps();
  resetTimer();
  renderQueuePreview();
  updateTotalTimeDisplay();
  switchTabDirect('timer');
  showToast('✓ Secuencia aplicada');
}

function switchTabDirect(tab) {
  document.querySelectorAll('.tab').forEach((t,i) => t.classList.toggle('active', ['timer','editor','saved'][i]===tab));
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.getElementById('tab-'+tab).classList.add('active');
}

function buildExpandedSteps() {
  expandedSteps = [];
  for (let r = 0; r < repeatCount; r++) {
    steps.forEach(s => expandedSteps.push({...s, round: r+1}));
  }
}

// ============================================================
// TIMER
// ============================================================
function resetTimer() {
  clearInterval(interval);
  running = false;
  currentStep = 0;
  releaseWakeLock();
  if (expandedSteps.length > 0) {
    timeLeft = expandedSteps[0].duration;
    totalStepTime = expandedSteps[0].duration;
  } else {
    timeLeft = 0; totalStepTime = 0;
  }
  updateTimerUI();
  document.getElementById('btnStartPause').textContent = '▶ Iniciar';
}

function startPause() {
  if (expandedSteps.length === 0) { showToast('Configura la secuencia en el Editor'); return; }
  if (running) {
    clearInterval(interval);
    running = false;
    releaseWakeLock();
    document.getElementById('btnStartPause').textContent = '▶ Continuar';
  } else {
    if (currentStep >= expandedSteps.length) { resetTimer(); return; }
    running = true;
    document.getElementById('btnStartPause').textContent = '⏸ Pausar';
    interval = setInterval(tick, 1000);
    requestWakeLock();
    speakPhase();
    const ctx = getAudioCtx();
    if (ctx.state === 'suspended') ctx.resume().catch(() => {});
  }
}

function tick() {
  timeLeft--;
  if (timeLeft <= 0) {
    beep('end');
    currentStep++;
    if (currentStep >= expandedSteps.length) {
      clearInterval(interval);
      running = false;
      timeLeft = 0;
      releaseWakeLock();
      document.getElementById('btnStartPause').textContent = '▶ Reiniciar';
      showToast('🏁 ¡Secuencia completada!');
      speak('¡Completado!');
    } else {
      timeLeft = expandedSteps[currentStep].duration;
      totalStepTime = expandedSteps[currentStep].duration;
      beep('start');
      speakPhase();
    }
  } else if (timeLeft <= 3) {
    beep('warn');
    speak(String(timeLeft));
  }
  updateTimerUI();
}

function skipStep() {
  if (!running && currentStep >= expandedSteps.length) return;
  clearInterval(interval);
  currentStep++;
  if (currentStep >= expandedSteps.length) {
    running = false;
    timeLeft = 0;
    releaseWakeLock();
    document.getElementById('btnStartPause').textContent = '▶ Reiniciar';
    updateTimerUI();
    return;
  }
  timeLeft = expandedSteps[currentStep].duration;
  totalStepTime = expandedSteps[currentStep].duration;
  updateTimerUI();
  if (running) {
    speakPhase();
    interval = setInterval(tick, 1000);
  }
}

function updateTimerUI() {
  const s = expandedSteps[currentStep];
  const clockEl = document.getElementById('timerClock');
  const mainEl = document.getElementById('timerMain');
  const fsClockEl = document.getElementById('fsClock');
  const fsNameEl = document.getElementById('fsName');
  const fsPhaseEl = document.getElementById('fsPhase');
  const fsStepEl = document.getElementById('fsStep');

  if (s) {
    document.getElementById('phaseLabel').textContent = TYPE_LABELS[s.type] + (repeatCount > 1 ? ` · Vuelta ${s.round}/${repeatCount}` : '');
    document.getElementById('phaseName').textContent = s.name;
    document.getElementById('phaseName').style.color = TYPE_COLORS[s.type];
    clockEl.style.color = TYPE_COLORS[s.type];
    clockEl.classList.toggle('warning', timeLeft <= 5 && timeLeft > 0);
    document.getElementById('progressFill').style.background = TYPE_COLORS[s.type];

    // FS
    fsPhaseEl.textContent = TYPE_LABELS[s.type];
    fsNameEl.textContent = s.name;
    fsNameEl.style.color = TYPE_COLORS[s.type];
    fsClockEl.style.color = TYPE_COLORS[s.type];
    fsClockEl.classList.toggle('warning', timeLeft <= 5 && timeLeft > 0);
    fsStepEl.textContent = `Paso ${currentStep+1} de ${expandedSteps.length}`;
  } else {
    document.getElementById('phaseLabel').textContent = 'LISTO';
    document.getElementById('phaseName').textContent = '¡Completado!';
    document.getElementById('phaseName').style.color = 'var(--accent3)';
    clockEl.style.color = 'var(--accent3)';
    fsClockEl.style.color = 'var(--accent3)';
    fsPhaseEl.textContent = 'COMPLETADO';
    fsNameEl.textContent = '¡Bien hecho!';
    fsStepEl.textContent = '';
  }

  clockEl.textContent = fmtTime(timeLeft);
  fsClockEl.textContent = fmtTime(timeLeft);

  const prog = totalStepTime > 0 ? (timeLeft / totalStepTime) * 100 : 0;
  document.getElementById('progressFill').style.width = prog + '%';
  document.getElementById('timerMain').style.setProperty('--progress', prog/100);

  document.getElementById('stepIndicator').textContent = `Paso ${Math.min(currentStep+1, expandedSteps.length)} / ${expandedSteps.length}`;

  // Total remaining
  const totalRem = expandedSteps.slice(currentStep).reduce((acc, x, i) => acc + (i === 0 ? timeLeft : x.duration), 0);
  document.getElementById('totalRemaining').textContent = fmtTime(totalRem);

  renderQueuePreview();
}

function updateTotalTimeDisplay() {
  const total = expandedSteps.reduce((s,x) => s+x.duration, 0);
  document.getElementById('total-time-display').textContent = `Total: ${fmtTime(total)}`;
}

// ============================================================
// QUEUE PREVIEW
// ============================================================
function renderQueuePreview() {
  const el = document.getElementById('queueSteps');
  if (expandedSteps.length === 0) {
    el.innerHTML = '<span style="font-family:\'DM Mono\',monospace;font-size:0.72rem;color:var(--muted)">Sin pasos — ve al Editor</span>';
    return;
  }
  el.innerHTML = expandedSteps.map((s, i) => {
    const isDone = i < currentStep;
    const isActive = i === currentStep;
    let cls = `queue-chip${isDone?' done-chip':''}${isActive?' active-chip':''}`;
    return `<span class="${cls}" style="color:${TYPE_COLORS[s.type]};${isActive?'':'opacity:'+(isDone?'0.3':'0.7')}">
      <span class="chip-dot" style="background:${TYPE_COLORS[s.type]}"></span>
      ${s.name} ${fmtTime(s.duration)}
    </span>`;
  }).join('');
}

// ============================================================
// SAVED STRUCTURES
// ============================================================
function saveFromEditor() {
  const repeatInput = document.getElementById('repeatCount');
  if (repeatInput) repeatCount = parseInt(repeatInput.value) || 1;
  if (steps.length === 0) { showToast('Agrega pasos antes de guardar'); return; }
  const nameEl = document.getElementById('saveNameInputEditor');
  const name = nameEl.value.trim() || ('Estructura ' + new Date().toLocaleTimeString('es-CL'));
  const saved = getSaved();
  const entry = { id: Date.now(), name, steps: JSON.parse(JSON.stringify(steps)), repeatCount };
  saved.push(entry);
  try {
    localStorage.setItem('timerPro_saved', JSON.stringify(saved));
    nameEl.value = '';
    showToast('💾 Guardado: ' + name);
  } catch(e) {
    showToast('Error: ' + e.message);
  }
}

function saveStructure() {
  // Sync repeatCount from editor input before saving
  const repeatInput = document.getElementById('repeatCount');
  if (repeatInput) repeatCount = parseInt(repeatInput.value) || 1;

  if (steps.length === 0) { showToast('Agrega pasos en el Editor primero'); return; }
  const name = document.getElementById('saveNameInput').value.trim() || ('Estructura ' + new Date().toLocaleTimeString('es-CL'));
  const saved = getSaved();
  const entry = { id: Date.now(), name, steps: JSON.parse(JSON.stringify(steps)), repeatCount };
  saved.push(entry);
  try {
    localStorage.setItem('timerPro_saved', JSON.stringify(saved));
    document.getElementById('saveNameInput').value = '';
    renderSavedList();
    showToast('💾 Guardado: ' + name);
  } catch(e) {
    showToast('Error al guardar: ' + e.message);
  }
}

function getSaved() {
  try { return JSON.parse(localStorage.getItem('timerPro_saved')) || []; }
  catch { return []; }
}

function loadStructure(id) {
  const saved = getSaved();
  const entry = saved.find(s => s.id === id);
  if (!entry) return;
  steps = JSON.parse(JSON.stringify(entry.steps));
  repeatCount = entry.repeatCount || 1;
  buildExpandedSteps();
  resetTimer();
  renderQueuePreview();
  updateTotalTimeDisplay();
  renderEditor();
  switchTabDirect('timer');
  showToast('✓ Cargado: ' + entry.name);
}

function deleteStructure(id) {
  const saved = getSaved().filter(s => s.id !== id);
  localStorage.setItem('timerPro_saved', JSON.stringify(saved));
  renderSavedList();
  showToast('Estructura eliminada');
}

function renderSavedList() {
  const saved = getSaved();
  const el = document.getElementById('savedList');
  if (saved.length === 0) {
    el.innerHTML = '<div class="empty-state">SIN ESTRUCTURAS GUARDADAS<br><br>Crea una secuencia en el Editor y guárdala aquí</div>';
    return;
  }
  el.innerHTML = [...saved].reverse().map(entry => {
    const total = entry.steps.reduce((s,x) => s+x.duration, 0) * (entry.repeatCount||1);
    const chips = entry.steps.slice(0,6).map(s =>
      `<span class="mini-chip" style="background:${TYPE_COLORS[s.type]}22;color:${TYPE_COLORS[s.type]}">${s.name.slice(0,10)} ${fmtTime(s.duration)}</span>`
    ).join('') + (entry.steps.length > 6 ? `<span class="mini-chip" style="color:var(--muted)">+${entry.steps.length-6}</span>` : '');

    return `<div class="saved-card">
      <div class="saved-info">
        <div class="saved-name">${entry.name}</div>
        <div class="saved-meta">${entry.steps.length} pasos · ×${entry.repeatCount||1} · ${fmtTime(total)} total</div>
        <div class="saved-chips">${chips}</div>
      </div>
      <div class="saved-actions">
        <button class="btn btn-load btn-sm" onclick="loadStructure(${entry.id})">▶ Cargar</button>
        <button class="btn btn-del btn-sm" onclick="deleteStructure(${entry.id})">✕</button>
      </div>
    </div>`;
  }).join('');
}

// ============================================================
// WAKE LOCK — evita que la pantalla se apague durante el entrenamiento
// ============================================================
let wakeLock = null;

async function requestWakeLock() {
  try {
    if ('wakeLock' in navigator) {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });
    }
  } catch (e) { /* no soportado o denegado: se ignora silenciosamente */ }
}

function releaseWakeLock() {
  if (wakeLock) { wakeLock.release().catch(() => {}); wakeLock = null; }
}

// Si la pestaña vuelve a estar visible mientras el timer corre, se reintenta el wake lock
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && running && !wakeLock) {
    requestWakeLock();
  }
});

// ============================================================
// VOZ (Web Speech API) — anuncia fase y cuenta regresiva 3,2,1
// ============================================================
function speak(text) {
  const toggle = document.getElementById('voiceToggle');
  if (!toggle || !toggle.checked) return;
  if (!('speechSynthesis' in window)) return;
  try {
    window.speechSynthesis.cancel(); // evita que se acumulen frases atrasadas
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'es-ES';
    u.rate = 1.05;
    u.volume = Math.min(masterVolume, 1);
    window.speechSynthesis.speak(u);
  } catch (e) { /* se ignora si el navegador no soporta o falla */ }
}

function speakPhase() {
  const s = expandedSteps[currentStep];
  if (s) speak(s.name || TYPE_LABELS[s.type]);
}

// ============================================================
// AUDIO (Web Audio API) — GainNode maestro con volumen ajustable
// ============================================================
let audioCtx = null;
let masterGain = null;
let compressor = null;
let makeupGain = null;
let masterVolume = 1.5; // 150% por defecto — más potencia de fábrica para competir con música externa

function getAudioCtx() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    masterGain = audioCtx.createGain();
    masterGain.gain.value = masterVolume;

    try {
      // Compresor: absorbe los picos para que no distorsione al subir el volumen
      compressor = audioCtx.createDynamicsCompressor();
      compressor.threshold.value = -24;
      compressor.knee.value = 10;
      compressor.ratio.value = 8;
      compressor.attack.value = 0.003;
      compressor.release.value = 0.25;

      // Ganancia de recuperación: sube el nivel de vuelta después de comprimir.
      makeupGain = audioCtx.createGain();
      makeupGain.gain.value = 3.5;

      masterGain.connect(compressor);
      compressor.connect(makeupGain);
      makeupGain.connect(audioCtx.destination);
    } catch (e) {
      // Si el compresor no está soportado en este navegador, conectar directo
      // (más simple, sin protección de picos, pero mejor que quedar en silencio)
      masterGain.connect(audioCtx.destination);
    }
  }
  return audioCtx;
}

function updateVolume(val) {
  masterVolume = val / 100;
  document.getElementById('volumeLabel').textContent = val + '%';
  if (masterGain) masterGain.gain.value = masterVolume;
}

function testBeep() {
  try {
    const ctx = getAudioCtx();
    ctx.resume().then(() => {
      showToast('Estado audio: ' + ctx.state + ' — sonando prueba...');
      beep('start');
    }).catch(err => showToast('❌ No se pudo activar audio: ' + err.message));
  } catch (err) {
    showToast('❌ Error al crear audio: ' + err.message);
  }
}

function beep(type) {
  if (!document.getElementById('soundToggle').checked) return;
  try {
    const ctx = getAudioCtx();
    if (ctx.state === 'suspended') ctx.resume().catch(() => {});
    // Ondas "square"/"sawtooth" tienen más armónicos que "sine": se escuchan más
    // fuerte y cortan mejor sobre música o ruido ambiente, aunque el volumen sea el mismo
    const configs = {
      start: [{freq:880, dur:0.16, wave:'square', gain:1}, {freq:1320, dur:0.22, wave:'square', gain:0.8}],
      end:   [{freq:660, dur:0.14, wave:'sawtooth', gain:1}, {freq:880, dur:0.14, wave:'sawtooth', gain:1}, {freq:1100, dur:0.32, wave:'sawtooth', gain:0.9}],
      warn:  [{freq:600, dur:0.11, wave:'square', gain:1}, {freq:600, dur:0.11, wave:'square', gain:1}]
    };
    const seq = configs[type] || configs.start;
    let t = ctx.currentTime;
    seq.forEach(({freq, dur, wave, gain: peakGain}) => {
      // Tono principal
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(masterGain);
      osc.frequency.value = freq;
      osc.type = wave || 'square';
      gain.gain.setValueAtTime(0, t);
      gain.gain.linearRampToValueAtTime(peakGain, t + 0.008);
      gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
      osc.start(t);
      osc.stop(t + dur + 0.02);

      // Capa una octava arriba, más suave: agrega "brillo" que ayuda a que el beep
      // se distinga de música con mucho bajo, sin sonar como un pitido agudo molesto
      const osc2 = ctx.createOscillator();
      const gain2 = ctx.createGain();
      osc2.connect(gain2);
      gain2.connect(masterGain);
      osc2.frequency.value = freq * 2;
      osc2.type = 'sine';
      gain2.gain.setValueAtTime(0, t);
      gain2.gain.linearRampToValueAtTime(peakGain * 0.35, t + 0.008);
      gain2.gain.exponentialRampToValueAtTime(0.001, t + dur * 0.8);
      osc2.start(t);
      osc2.stop(t + dur + 0.02);

      t += dur + (type === 'warn' ? 0.06 : 0.03);
    });
  } catch(e) {
    if (!window._beepErrorShown) {
      window._beepErrorShown = true;
      showToast('❌ Beep falló: ' + e.message);
    }
  }
}

// ============================================================
// FULLSCREEN
// ============================================================
function toggleFullscreen() {
  fullscreenOpen = !fullscreenOpen;
  document.getElementById('fullscreenOverlay').classList.toggle('visible', fullscreenOpen);
  if (fullscreenOpen) {
    updateTimerUI();
    const el = document.documentElement;
    const req = el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen;
    if (req) req.call(el).catch(() => {});
    if (screen.orientation && screen.orientation.lock) {
      screen.orientation.lock('landscape').catch(() => {});
    }
  } else {
    exitBrowserFullscreen();
  }
}

function exitBrowserFullscreen() {
  const exit = document.exitFullscreen || document.webkitExitFullscreen || document.mozCancelFullScreen;
  if (exit && (document.fullscreenElement || document.webkitFullscreenElement)) {
    exit.call(document).catch(() => {});
  }
}

// Si el usuario sale del modo inmersivo con el gesto/botón del sistema (no con "✕ Cerrar"),
// sincroniza el overlay para que no quede "atascado" en fullscreen visual sin estar en fullscreen real
['fullscreenchange', 'webkitfullscreenchange'].forEach(evt => {
  document.addEventListener(evt, () => {
    if (!document.fullscreenElement && !document.webkitFullscreenElement && fullscreenOpen) {
      fullscreenOpen = false;
      document.getElementById('fullscreenOverlay').classList.remove('visible');
    }
  });
});

// ============================================================
// UTILS
// ============================================================
function fmtTime(sec) {
  sec = Math.max(0, Math.floor(sec));
  const m = Math.floor(sec / 60);
  const s = sec % 60;
  return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// ============================================================
// INIT — Load default example
// ============================================================
window.onload = function() {
  steps = [
    { name: 'Preparación', duration: 10, type: 'prep' },
    { name: 'Trabajo', duration: 60, type: 'trabajo' },
    { name: 'Descanso', duration: 30, type: 'descanso' },
    { name: 'Trabajo', duration: 60, type: 'trabajo' },
    { name: 'Descanso', duration: 30, type: 'descanso' },
  ];
  repeatCount = 1;
  buildExpandedSteps();
  resetTimer();
  renderQueuePreview();
  updateTotalTimeDisplay();
  renderEditor();
  renderSavedList();

  // Keyboard shortcuts
  document.addEventListener('keydown', e => {
    if (e.code === 'Space' && e.target.tagName !== 'INPUT') { e.preventDefault(); startPause(); }
    if (e.code === 'ArrowRight') skipStep();
    if (e.code === 'KeyR') resetTimer();
    if (e.code === 'KeyF') toggleFullscreen();
  });

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('service-worker.js').catch(() => {});
  }
};
